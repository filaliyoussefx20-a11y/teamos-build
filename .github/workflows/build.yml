name: Build TeamOS ISO
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso isolinux squashfs-tools debootstrap

      - name: Prepare files
        run: |
          cp TeamOS.html teamos.html
          mkdir -p config/includes.chroot/home/teamos/teamos
          cp teamos.html config/includes.chroot/home/teamos/teamos/index.html

      - name: Build ISO
        run: |
          lb config \
            --distribution bookworm \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer none \
            --bootappend-live "boot=live components quiet splash" \
            --memtest none
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: TeamOS-ISO
          path: "*.iso"
          retention-days: 7
